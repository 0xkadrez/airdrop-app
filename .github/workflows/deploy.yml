name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Ejecutar el workflow cuando se hace push a la rama main
  workflow_dispatch:  # Permite ejecutar el workflow manualmente desde la interfaz de GitHub

# Configuración para los permisos del token GITHUB_TOKEN
permissions:
  contents: write  # Permiso para escribir en el repositorio

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3

      - name: Setup Node.js 🔧
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies 📦
        run: npm ci

      - name: Build 🏗️
        run: npm run build

      - name: Copy CNAME file 📋
        run: cp public/CNAME build/

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages  # Rama donde se desplegará el build
          folder: build  # Carpeta que contiene el build
          clean: true  # Elimina archivos anteriores en la rama gh-pages 